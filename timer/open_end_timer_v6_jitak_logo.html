/* V3: large sponsor identities and true TV-fit layout */
html,body{width:100%;min-height:100%;overflow-x:hidden}
.app{width:100%;max-width:1920px;min-height:100dvh;height:auto;gap:clamp(5px,.65vh,10px);padding:clamp(12px,1.35vw,25px)}
.top{min-height:clamp(115px,15vh,170px);gap:clamp(14px,2vw,30px)}
.logo{flex:0 0 clamp(175px,19vw,310px);min-width:0;max-width:none;height:clamp(120px,15vh,180px);padding:5px;border-radius:20px;background:#ffffff08}
.logo img{width:100%;height:100%;object-fit:contain;object-position:center;filter:drop-shadow(0 5px 12px #0008)}
.top>div:nth-child(2){flex:1;min-width:0}
h1{font-size:clamp(30px,3.7vw,66px)}
.scores{margin:3px 0;gap:clamp(16px,4vw,65px)}
.score{width:clamp(74px,8.3vw,128px)}
.target{font-size:clamp(32px,3.7vw,65px)}
.clock-wrap{margin:4px 0;padding:clamp(8px,1.5vh,20px) 6px}
.clock{font-size:clamp(72px,13.2vw,245px)}
.message{font-size:clamp(24px,2.5vw,42px)}
.controls{margin:0}.play{width:clamp(95px,9vw,145px);height:clamp(95px,9vw,145px)}
body.fullscreen{overflow:hidden}body.fullscreen .app{height:100dvh;min-height:0;overflow:hidden;gap:2px}body.fullscreen .top{min-height:0;height:17vh}body.fullscreen .logo{height:100%;flex-basis:clamp(170px,19vw,320px)}body.fullscreen .scores{margin:0}body.fullscreen .score{width:min(11vh,115px)}body.fullscreen .clock-wrap{padding:1.2vh 6px}body.fullscreen .clock{font-size:min(13.5vw,23vh)}body.fullscreen .play{width:min(12vh,120px);height:min(12vh,120px)}body.fullscreen .message{font-size:min(3vw,4vh)}

<script>
(()=>{'use strict';const $=id=>document.getElementById(id);let state='ready',start=0,elapsed=0,raf=0,wins=0,losses=0,rounds=0,lastInput=0;const fmt=ms=>{let cs=Math.floor(Math.max(0,ms)/10),s=Math.floor(cs/100);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')+'.'+String(cs%100).padStart(2,'0')};const target=()=>Math.max(100,Math.min(999000,Number($('target').value||3)*1000));const margin=()=>Math.max(0,Math.min(1000,Number($('margin').value||0)*1000));const msg=t=>$('message').textContent=t;function show(){$('clock').textContent=state==='running'&&$('hideClock').checked?'--:--.--':fmt(elapsed)}function tick(){if(state!=='running')return;elapsed=performance.now()-start;show();raf=requestAnimationFrame(tick)}function beep(win){try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;let a=new A();[0,1,2].forEach((i)=>{let o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=win?660+i*220:250-i*60;g.gain.value=.05;o.start(a.currentTime+i*.13);o.stop(a.currentTime+i*.13+.12)});setTimeout(()=>a.close(),900)}catch(e){}}function reset(){cancelAnimationFrame(raf);state='ready';elapsed=0;$('clock').className='clock';show();$('play').textContent='ابدأ';msg('جاهز للتحدي؟')}function play(){let now=performance.now();if(now-lastInput<120)return;lastInput=now;if(state==='ready'){elapsed=0;start=performance.now();state='running';$('clock').className='clock';$('play').textContent='أوقف';msg('أوقف الساعة عند الوقت المحدد!');tick()}else if(state==='running'){elapsed=performance.now()-start;state='finished';cancelAnimationFrame(raf);rounds++;let won=Math.abs(elapsed-target())<=margin();won?wins++:losses++;$('wins').textContent=wins;$('losses').textContent=losses;$('rounds').textContent=rounds;$('clock').className='clock '+(won?'win':'lose');show();msg(won?'🎉 مبروك! فزت بالتحدي':'النتيجة '+fmt(elapsed)+' — حاول مرة ثانية');$('play').textContent='جولة جديدة';beep(won)}else reset()}$('play').onclick=play;$('reset').onclick=reset;$('clear').onclick=()=>{wins=losses=rounds=0;['wins','losses','rounds'].forEach(id=>$(id).textContent='0');reset()};$('target').onchange=()=>{$('targetText').textContent=fmt(target())};$('hideClock').onchange=show;$('full').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.().catch(()=>{});else document.exitFullscreen?.()};document.addEventListener('fullscreenchange',()=>document.body.classList.toggle('fullscreen',!!document.fullscreenElement));document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))return;if((e.code==='Space'||e.code==='Enter')&&!e.repeat){e.preventDefault();play()}else if(e.code==='KeyR')reset();else if(e.code==='KeyF')$('full').click()});function logo(fileId,boxId,key){let saved;try{saved=localStorage.getItem(key)}catch(e){}if(saved)$(boxId).innerHTML='<img alt="الشعار" src="'+saved+'">';$(fileId).addEventListener('change',e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{let img=document.createElement('img');img.alt='الشعار';img.src=r.result;$(boxId).replaceChildren(img);try{localStorage.setItem(key,r.result)}catch(e){}};r.readAsDataURL(f)})}logo('heartFile','heartLogo','openend_heart_logo');logo('jitakFile','jitakLogo','openend_jitak_logo_20261112');$('targetText').textContent=fmt(target());reset()})();
